<div class="product-card">
    <div class="product-image">
        <img #productImg [src]="primaryImage" [alt]="product.name" (error)="productImg.src=fallbackImage" />
        <div class="product-badge" [ngClass]="badgeClass">{{ product.category }}</div>
    </div>

    <div class="product-content">
        <div class="product-header">
            <div class="category-icon" [innerHTML]="categoryIcon"></div>
            <h3 class="product-name">{{ product.name }}</h3>
        </div>

        <p class="product-condition">{{ product.condition }}</p>

        <p class="product-dimensions" *ngIf="product.specifications['Breite'] || product.specifications['Höhe']">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 3H3v18h18V3z"/><path d="M3 9h18M9 21V9"/></svg>
            {{ product.specifications['Breite'] || '–' }} × {{ product.specifications['Höhe'] || '–' }}
        </p>

        <div class="product-footer">
            <div class="product-price">
                <span class="price-amount">{{ product.price }}€</span>
                <span class="price-vat">Inkl. MwSt.</span>
            </div>
            <button class="btn-details">
                Details
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M5 12h14M12 5l7 7-7 7" />
                </svg>
            </button>
        </div>
    </div>
</div>
