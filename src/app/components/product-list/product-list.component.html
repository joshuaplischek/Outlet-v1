<section class="product-list section" id="outlet">
    <div class="container">
        <h2 class="section-title text-center mb-lg">Unser Outlet</h2>

        <!-- Full mode: Kategorie- + Materialfilter + Sortierung -->
        <ng-container *ngIf="mode === 'full'">
            <div class="filters mb-md">
                <button
                    *ngFor="let filter of categoryFilters"
                    class="filter-btn"
                    [class.active]="selectedCategory === filter.value"
                    [attr.aria-pressed]="selectedCategory === filter.value"
                    (click)="filterByCategory(filter.value)">
                    {{ filter.label }}
                </button>
            </div>

            <div class="filter-row mb-md">
                <div class="material-filters">
                    <span class="filter-label">Material:</span>
                    <button
                        *ngFor="let mat of materialFilters"
                        class="filter-chip"
                        [class.active]="selectedMaterial === mat.value"
                        [attr.aria-pressed]="selectedMaterial === mat.value"
                        (click)="filterByMaterial(mat.value)">
                        {{ mat.label }}
                    </button>
                </div>

                <div class="sort-control">
                    <label class="filter-label" for="sort-select">Sortierung:</label>
                    <div class="sort-select-wrap">
                        <select id="sort-select" class="sort-select" [value]="selectedSort" (change)="sortBy($any($event.target).value)">
                            <option *ngFor="let opt of sortOptions" [value]="opt.value">{{ opt.label }}</option>
                        </select>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
                    </div>
                </div>
            </div>

            <div class="dimension-filters mb-xl">
                <span class="filter-label">Maße:</span>
                <div class="dimension-group">
                    <span class="dim-label">Breite</span>
                    <div class="dim-input-wrap">
                        <input class="dim-input" type="number" placeholder="Min" min="0"
                            [(ngModel)]="minBreite" (ngModelChange)="onDimensionInput()" />
                        <span class="dim-unit">mm</span>
                    </div>
                    <span class="dim-sep">–</span>
                    <div class="dim-input-wrap">
                        <input class="dim-input" type="number" placeholder="Max" min="0"
                            [(ngModel)]="maxBreite" (ngModelChange)="onDimensionInput()" />
                        <span class="dim-unit">mm</span>
                    </div>
                </div>
                <div class="dimension-group">
                    <span class="dim-label">Höhe</span>
                    <div class="dim-input-wrap">
                        <input class="dim-input" type="number" placeholder="Min" min="0"
                            [(ngModel)]="minHoehe" (ngModelChange)="onDimensionInput()" />
                        <span class="dim-unit">mm</span>
                    </div>
                    <span class="dim-sep">–</span>
                    <div class="dim-input-wrap">
                        <input class="dim-input" type="number" placeholder="Max" min="0"
                            [(ngModel)]="maxHoehe" (ngModelChange)="onDimensionInput()" />
                        <span class="dim-unit">mm</span>
                    </div>
                </div>
            </div>

            <div class="active-filters mb-md" *ngIf="hasActiveFilters">
                <span class="active-filters-label">Aktive Filter:</span>
                <span class="filter-chip active" *ngIf="selectedCategory !== 'ALLE'">
                    {{ selectedCategory }}
                </span>
                <span class="filter-chip active" *ngIf="selectedMaterial !== 'ALLE'">
                    {{ selectedMaterial }}
                </span>
                <button class="reset-btn" (click)="resetFilters()">Filter zurücksetzen</button>
            </div>
        </ng-container>

        <!-- Error Banner -->
        <div class="error-banner" *ngIf="hasError">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            API nicht erreichbar — es werden Demo-Produkte angezeigt.
        </div>

        <!-- Loading State -->
        <div class="loading-state" *ngIf="isLoading">
            <div class="spinner"></div>
            <p>Produkte werden geladen...</p>
        </div>

        <!-- Produktgrid -->
        <div class="products-grid" *ngIf="!isLoading">
            <app-product-card
                *ngFor="let product of displayedProducts"
                [product]="product"
                (click)="openProductDetail(product)">
            </app-product-card>
        </div>

        <!-- Empty State -->
        <div class="empty-state" *ngIf="!isLoading && displayedProducts.length === 0">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.35-4.35" />
            </svg>
            <h3>Keine Produkte gefunden</h3>
            <p>Versuchen Sie einen anderen Filter</p>
        </div>

        <!-- Pagination (nur full mode) -->
        <nav class="pagination" *ngIf="mode === 'full' && !isLoading && totalPages > 1" aria-label="Seitennavigation">
            <button class="page-btn prev" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)" aria-label="Vorherige Seite">&#8249;</button>

            <ng-container *ngFor="let p of visiblePages">
                <span class="page-ellipsis" *ngIf="p === '…'">…</span>
                <button *ngIf="p !== '…'" class="page-btn"
                    [class.active]="p === currentPage"
                    [attr.aria-current]="p === currentPage ? 'page' : null"
                    (click)="goToPage(+p)">{{ p }}</button>
            </ng-container>

            <button class="page-btn next" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)" aria-label="Nächste Seite">&#8250;</button>
        </nav>

        <!-- CTA (nur teaser mode) -->
        <div class="teaser-cta" *ngIf="mode === 'teaser'">
            <a class="btn-cta" routerLink="/outlet">
                Alle Produkte ansehen
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M5 12h14M12 5l7 7-7 7" />
                </svg>
            </a>
        </div>
    </div>

    <app-product-detail-modal *ngIf="showModal && selectedProduct" [product]="selectedProduct" (close)="closeModal()">
    </app-product-detail-modal>
</section>
